[tool.poetry]
name = "studio-alba-asistente"
version = "0.1.0"
description = "Asistente de reservas con IA para una peluquería: agente con LangGraph, RAG, SQLite, Streamlit y Google Calendar."
authors = ["Alba Rodríguez Perales"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
langchain = "1.4.2"
langchain-openai = "1.6.6"
langgraph = "1.2.12"
fastapi = {version = "0.141.1", extras = ["standard"]}
python-dotenv = "1.2.3"
pydantic-settings = "^2.10.1"
langchain-community = "^0.4.2"
pandas = "^3.0.6"
langchain-chroma = "^1.1.0"
streamlit = "^1.64.0"
google-api-python-client = "^2.200.0"
google-auth = "^2.59.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
ipykernel = "^7.3.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
